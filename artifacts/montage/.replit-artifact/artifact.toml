kind = "web"
previewPath = "/"
title = "Montage - Video Editing Portfolio"
version = "1.0.0"
id = "artifacts/montage"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24310
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/montage run dev"

[services.env]
PORT = "24310"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/montage", "run", "build"]
publicDir = "artifacts/montage/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
